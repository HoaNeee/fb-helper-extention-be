springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
#env config
app.jwt.secret=${JWT_SECRET:mysecretsieucapvippro123456789}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.upload.dir=${PATH_UPLOAD_DIR:C:\\media\\fb-extention\\uploads}
app.ip-default=${IP_ADDRESS_DEFAULT:127.0.0.1}



