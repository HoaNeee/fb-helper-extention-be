spring.application.name=fb_helper_extension
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fb_helper_extension}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
#config file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Swagger config
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
#env config
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.upload.dir=${PATH_UPLOAD_DIR:/tmp/uploads}
app.ip-default=${IP_ADDRESS_DEFAULT:127.0.0.1}
app.seed.enabled=${SEED_DATA:false}
app.env=${ENV:dev}
app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}



